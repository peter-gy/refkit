name: Publish
'on':
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
permissions:
  contents: read
env:
  SCCACHE_GHA_RW_MODE: READ_ONLY
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  source-checks:
    name: Source checks
    uses: ./.github/workflows/source-checks.yml
  check-release-version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Check package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python scripts/release_contract.py --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
  publish-refkit:
    name: refkit / Publish to PyPI
    needs:
      - check-release-version
      - source-checks
      - artifacts-refkit
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.14'
          enable-cache: false
          cache-dependency-glob: uv.lock
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: refkit_*
          merge-multiple: true
          path: dist/refkit
      - name: Publish package
        run: |
          python scripts/artifact_manifest.py check dist/refkit --package refkit --version "$RELEASE_VERSION"
          uv run --locked --only-group build twine check --strict dist/refkit/*.whl dist/refkit/*.tar.gz
          python scripts/distribution_contract.py dist/refkit/*.whl dist/refkit/*.tar.gz
          uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/refkit/*.whl dist/refkit/*.tar.gz
        env:
          RELEASE_VERSION: ${{ needs.check-release-version.outputs.version }}
  publish-polars-refkit:
    name: polars-refkit / Publish to PyPI
    needs:
      - check-release-version
      - source-checks
      - artifacts-polars-refkit
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.14'
          enable-cache: false
          cache-dependency-glob: uv.lock
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: polars_refkit_*
          merge-multiple: true
          path: dist/polars-refkit
      - name: Publish package
        run: |
          python scripts/artifact_manifest.py check dist/polars-refkit --package polars-refkit --version "$RELEASE_VERSION"
          uv run --locked --only-group build twine check --strict dist/polars-refkit/*.whl dist/polars-refkit/*.tar.gz
          python scripts/distribution_contract.py dist/polars-refkit/*.whl dist/polars-refkit/*.tar.gz
          uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/polars-refkit/*.whl dist/polars-refkit/*.tar.gz
        env:
          RELEASE_VERSION: ${{ needs.check-release-version.outputs.version }}
  release-complete:
    name: Release complete
    needs:
      - publish-refkit
      - publish-polars-refkit
      - benchmarks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check package publish results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: info["result"]
              for name, info in needs.items()
              if info["result"] != "success"
          }
          if failed:
              raise SystemExit(f"Release publish jobs did not all succeed: {failed}")
          PY
  release-notes:
    name: Update release notes
    needs:
      - release-complete
      - benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install release note generator
        working-directory: .github/release-notes
        run: |
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Update release notes
        run: .github/release-notes/node_modules/.bin/changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.benchmarks.outputs.artifact-name }}
          path: benchmark-evidence
      - name: Attach benchmark results
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m scripts.benchmark_release benchmark-evidence
          gh release upload "$RELEASE_TAG" benchmark-results.zip benchmark-results.json benchmark-results.md --clobber
  benchmarks:
    name: Benchmark evidence
    needs: check-release-version
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/benchmarks.yml
  artifacts-refkit:
    needs:
      - check-release-version
      - test-support
    uses: ./.github/workflows/artifacts-refkit.yml
  artifacts-polars-refkit:
    needs:
      - check-release-version
      - test-support
    uses: ./.github/workflows/artifacts-polars-refkit.yml
  docs:
    uses: ./.github/workflows/docs.yml
  test-support:
    uses: ./.github/workflows/test-support.yml
