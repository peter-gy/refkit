name: Verification package
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  build:
    name: Build installed verification support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Build verification wheel
        run: uv build --package refkit-tests --wheel --out-dir test-support --no-create-gitignore
      - name: Capture source build constraints
        run: |
          python - <<'PYCODE'
          import tomllib
          from pathlib import Path

          constraints = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["uv"]["build-constraint-dependencies"]
          Path("test-support/build-constraints.txt").write_text("\n".join(constraints) + "\n")
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: refkit-tests
          path: test-support/*
          retention-days: 7
          if-no-files-found: error
