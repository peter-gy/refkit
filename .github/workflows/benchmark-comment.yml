name: Benchmark commit comment
'on':
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: benchmark-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update commit performance comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.benchmark_comment
