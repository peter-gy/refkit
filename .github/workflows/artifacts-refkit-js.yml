name: JavaScript artifacts
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    name: Build npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: packages/refkit-js/rust -> target
      - name: Install binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build and check JavaScript package
        run: |
          make js-build
          npm --prefix packages/refkit-js run lint
          npm --prefix packages/refkit-js run typecheck
          npm --prefix packages/refkit-js test
          npm --prefix packages/refkit-js audit --audit-level=high
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Compare Python and JavaScript APIs
        run: uv run --locked --package refkit --group dev python packages/refkit-js/tests/parity.py
      - name: Check paired documentation examples
        run: npm --prefix packages/refkit-js run test:docs
      - name: Pack release artifact
        working-directory: packages/refkit-js
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: refkit-js-npm
          path: packages/refkit-js/refkit-js-*.tgz
          if-no-files-found: error
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs:
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22.19.0
          - '24'
          - '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: refkit-js-npm
          path: artifacts
      - name: Install test tools
        run: npm --prefix packages/refkit-js ci --ignore-scripts --no-audit --no-fund
      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(node -p 'require("./packages/refkit-js/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Test installed package and consumer types
        shell: bash
        run: npm --prefix packages/refkit-js run test:package -- "${{ github.workspace }}/artifacts/refkit-js-${{
          steps.package.outputs.version }}.tgz"
  browser:
    name: Browser package
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: refkit-js-npm
          path: artifacts
      - name: Install test tools and package
        run: |
          npm --prefix packages/refkit-js ci --ignore-scripts --no-audit --no-fund
          mkdir -p packages/refkit-js/.browser-package
          tar -xzf artifacts/refkit-js-*.tgz -C packages/refkit-js/.browser-package
      - name: Install browsers
        working-directory: packages/refkit-js
        run: npm exec -- playwright install --with-deps chromium firefox webkit
      - name: Test installed browser package
        env:
          REFKIT_PACKAGE_ROOT: ${{ github.workspace }}/packages/refkit-js/.browser-package/package
        run: npm --prefix packages/refkit-js run test:browser
