name: Source Checks
'on':
  workflow_call: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows-benchmark-process:
    name: Windows benchmark process
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install benchmark harness
        run: uv sync --locked --package refkit-bench --no-default-groups --no-install-package refkit --no-install-package polars-refkit
      - name: Check Windows worker transport and deadline
        run: >-
          uv run --no-sync --with pytest==9.1.1 python -m pytest -q -o addopts=
          packages/refkit-bench/tests/test_measurement.py::test_workers_preserve_preflight_runtime_configuration
          packages/refkit-bench/tests/test_measurement.py::test_process_output_and_timeout_are_bounded
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lint
        run: make python-lint
      - name: Check types
        run: make typecheck
      - name: Test
        run: make test
      - name: Set up benchmark Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Test benchmark contracts
        run: make benchmark-test
      - name: Smoke benchmark execution
        run: uv run --locked --all-packages --group dev refkit-bench run --lane format.layout --dataset tiny --smoke --output
          "$RUNNER_TEMP/benchmark-smoke"
      - name: Test documentation examples
        run: make docs-examples-check
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.14'
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            packages/polars-refkit/rust -> target
      - name: Lint
        run: make rust-lint
      - name: Test
        run: make rust
  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.88'
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: msrv
          workspaces: |
            . -> target
            packages/polars-refkit/rust -> target
      - name: Check minimum Rust version
        run: make rust-floor
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check release note generator
        working-directory: .github/release-notes
        run: |
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          ./node_modules/.bin/changelogithub --version
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.14'
          enable-cache: false
      - run: make release-check architecture-check pyodide-lock-check docs-source-check
