name: Source Checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lint
        run: make python-lint

      - name: Check types
        run: make typecheck

      - name: Test
        run: make test

      - name: Check release contract
        run: make release-check

      - name: Check architecture contract
        run: make architecture-check

      - name: Check documentation contract
        run: make docs-check

      - name: Check Pyodide runtime lock
        run: make pyodide-lock-check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            crates/bibtex-tidy-rs -> target
            packages/polars-refkit/rust -> target

      - name: Lint
        run: make rust-lint

      - name: Test
        run: make rust

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv
          workspaces: |
            . -> target
            crates/bibtex-tidy-rs -> target
            packages/polars-refkit/rust -> target

      - name: Check minimum Rust version
        run: make rust-floor

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Check release note generator
        working-directory: .github/release-notes
        run: |
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          ./node_modules/.bin/changelogithub --version
