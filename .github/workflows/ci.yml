name: CI
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-checks:
    name: Source checks
    uses: ./.github/workflows/source-checks.yml
  check:
    name: Check
    if: always()
    needs:
      - source-checks
      - artifacts-refkit
      - artifacts-polars-refkit
      - docs
      - test-support
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: info["result"]
              for name, info in needs.items()
              if info["result"] != "success"
          }
          if failed:
              raise SystemExit(f"Required CI jobs did not all succeed: {failed}")
          PY
  artifacts-refkit:
    name: refkit artifacts
    uses: ./.github/workflows/artifacts-refkit.yml
    needs:
      - test-support
  artifacts-polars-refkit:
    name: polars-refkit artifacts
    uses: ./.github/workflows/artifacts-polars-refkit.yml
    needs:
      - test-support
  docs:
    uses: ./.github/workflows/docs.yml
  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
  test-support:
    uses: ./.github/workflows/test-support.yml
