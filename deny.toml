[graph]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Maintenance-only advisory: biblatex 0.12 and the pinned Hayagriva engine require paste 1.0.15 for compile-time macros; upstream has no patched release. Other advisories remain errors." },
]

[licenses]
unused-allowed-license = "deny"
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "Unicode-3.0", "Zlib", "CC0-1.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "syn@=2.0.119", reason = "Pinned proc-macro dependencies use syn 2 while other derives use syn 3; their AST APIs are incompatible." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/typst/hayagriva", "https://github.com/typst/citationberg"]
