[package]
name = "refkit-js-native"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/peter-gy/refkit"
description = "WebAssembly adapter for refkit-js"
include = ["/Cargo.toml", "/src"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
refkit-core = { path = "../../../crates/refkit-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "=0.2.126"

[workspace]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }
