[project]
name = "refkit"
version = "0.1.1"
description = "Fast Python citation parsing, rendering, and BibTeX editing backed by Rust"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = [
    "agent-plugins==0.2.0",
]

[project.urls]
Documentation = "https://peter-gy.github.io/refkit/"
Issues = "https://github.com/peter-gy/refkit/issues"
Repository = "https://github.com/peter-gy/refkit"

[project.entry-points."marimo.agent.capability"]
refkit = "refkit.agent"

[build-system]
requires = ["agent-plugins==0.2.0", "maturin>=1.9,<2"]
build-backend = "build_backend"
backend-path = ["."]

[tool.agent-plugins]
root = "../.."

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "refkit._native"
bindings = "pyo3"
features = ["extension-module"]
editable-profile = "dev"
strip = true
locked = true
include = [
    { path = "build_backend.py", format = "sdist" },
]
exclude = [
    "src/**/__pycache__/**",
    "src/**/*.pyc",
    "src/**/*.pyo",
]

[tool.maturin.sbom]
rust = false
auditwheel = false
