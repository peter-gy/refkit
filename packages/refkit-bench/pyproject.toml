[project]
name = "refkit-bench"
version = "0.0.1"
description = "Benchmark runner for refkit citation and BibTeX workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.10,<3.15"
dependencies = [
    'bibtexparser==2.0.0b9',
    'citeproc-py-styles==0.1.6',
    'citeproc-py==0.10.1',
    'polars-refkit',
    'polars==1.42.1',
    'psutil==7.2.2',
    'pybtex==0.26.1',
    'pyperf==2.10.0',
    'refkit',
]

[project.scripts]
refkit-bench = "refkit_bench.runner:main"

[tool.uv.sources]
polars-refkit = { workspace = true }
refkit = { workspace = true }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "src/refkit_bench",
    "tests",
    "hatch_build.py",
    "node/package.json",
    "node/package-lock.json",
]
exclude = [
    ".gitignore",
    "/.gitignore",
    ".pytest_cache",
    "**/.pytest_cache",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refkit_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=refkit_bench",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
omit = ["tests/*"]
patch = ["subprocess"]
