[workspace]
members = [
    "crates/refkit-core",
    "packages/refkit/rust",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/peter-gy/refkit"

[workspace.dependencies]
pyo3 = "0.29.0"
refkit-core = { version = "0.3.0", path = "crates/refkit-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
citationberg = {git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d"}

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
excessive_nesting = "deny"
indexing_slicing = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
