[project]
name = "refkit-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "polars-refkit",
    "refkit",
]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { agent-plugins = "2026-09-07T00:00:00Z" }
package = false
build-constraint-dependencies = ["maturin==1.15.0", "agent-plugins==0.2.0", "hatchling==1.32.0"]

[tool.uv.sources]
refkit-bench = { workspace = true }
polars-refkit = { workspace = true }
refkit = { workspace = true }
refkit-tests = {workspace = true}

[tool.uv.workspace]
members = [
    "packages/refkit-bench",
    "packages/refkit",
    "packages/polars-refkit",
    "packages/refkit-tests",
]

[tool.ty.environment]
extra-paths = ["packages/refkit-tests/src"]
python-version = "3.10"
[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "hypothesis>=6.167.1",
    "marimo==0.24.0",
    "maturin>=1.15.0,<2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
    "ty>=0.0.78",
    "refkit-tests",
    "tomli==2.3.1",
]
build = [
    "twine==7.0.0",
    "agent-plugins==0.2.0",
    "tomli==2.3.1; python_version < '3.11'",
]
pyodide-build = [
    "pyodide-build==0.35.1; python_version >= '3.12'",
]
lint = ["ruff==0.16.5"]

[tool.pytest.ini_options]
testpaths = [
    "packages/refkit/tests",
    "packages/polars-refkit/tests",
    "scripts/tests",
    "packages/refkit-tests/src/refkit_tests",
]
addopts = [
    "--strict",
    "-W",
    "error",
    "--cov=refkit",
    "--cov=polars_refkit",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
omit = [
    "packages/refkit-bench/tests/*",
    "packages/refkit/tests/*",
    "packages/polars-refkit/tests/*",
]

[tool.pyrefly]
project-includes = [
    "packages/refkit/src/refkit",
    "packages/refkit/tests",
    "packages/polars-refkit/polars_refkit",
    "packages/polars-refkit/tests",
    "packages/refkit-bench/src/refkit_bench",
    "packages/refkit-bench/tests",
    "scripts",
    "packages/refkit-tests/src/refkit_tests",
]
project-excludes = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
    "**/build",
    "**/dist",
    "**/target",
]
python-version = "3.10"
search-path = [
    "packages/refkit-bench/src",
    "packages/refkit/src",
    "packages/polars-refkit",
    "packages/refkit-tests/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PIE",
    "PYI",
    "T10",
    "T20",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = [
    "refkit_bench",
    "polars_refkit",
    "refkit",
    "tests",
    "refkit_tests",
]

[tool.ruff.lint.per-file-ignores]
"packages/refkit-bench/src/refkit_bench/runner.py" = ["T201"]
"packages/refkit-bench/src/refkit_bench/affinity.py" = ["PERF203"]
"scripts/artifact_manifest.py" = ["PERF203"]
"scripts/normalize_wheel.py" = ["PERF203"]
